<!DOCTYPE html>
<!--
  resume.html - Resume Page
  Structure: Navigation → Header → PDF Viewer
-->
<html lang="en">
<head>
  <!-- ===== METADATA ===== -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume - Mason Bergen</title>

  <!-- ===== STYLES ===== -->
  <style>
    /* Font imports */
    @import url('https://fonts.googleapis.com/css2?family=Forum&display=swap');

    /* Global resets */
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Forum", serif;
      background: linear-gradient(180deg, #000, #222);
      color: #fff;
    }

    /* ===== NAVIGATION STYLES ===== */
    nav {
      background-color: black;
      font-family: "Forum", serif;
      padding: 0.5rem 0;
    }

    ul {
      text-align: left;
      padding: 0.25rem 0 0.25rem 100px;
      margin: 0;
    }

    li {
      display: inline-block;
      width: clamp(100px, 15vw, 200px);
      line-height: 1.4;
      font-family: "Forum", serif;
      font-size: clamp(1rem, 2vw, 1.5rem);
    }

    a {
      color: white;
      text-decoration: none;
      display: block;
    }

    /* ===== CONTENT STYLES ===== */
    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 1rem;
      box-sizing: border-box;
    }

    .content-grid {
      display: block;
    }

    .pdf-col {
      width: 100%;
    }

    .pdf-viewer {
      margin-top: 1rem;
    }

    .pdf-viewer object,
    .pdf-viewer iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 10rem);
      border: none;
    }

    p {
      font-size: clamp(0.95rem, 2.6vw, 1.1rem);
      margin: 0.75rem 0;
    }

    /* ===== RESPONSIVE STYLES ===== */
    @media (max-width: 800px) {
      .wrap {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .content-grid {
        display: block;
        width: 100%;
      }

      .pdf-col {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .pdf-viewer object,
      .pdf-viewer iframe {
        height: calc(100vh - 2rem);
        width: 100%;
        margin: 0;
        padding: 0;
      }
    }

    @media (min-aspect-ratio: 4/3) {
      .wrap {
        margin: 1.5rem auto;
        max-width: 100%;
        padding: 1rem;
      }

      .content-grid {
        display: block;
      }

      .pdf-col {
        width: 100%;
      }

      .pdf-viewer object,
      .pdf-viewer iframe {
        width: 100%;
        height: 70vh;
      }

      p {
        margin: 0 0 0.75rem 0;
      }
    }
  </style>
</head>

<body>
  <!-- ===== NAVIGATION BAR ===== -->
  <nav>
    <ul>
      <li> <a href="index.html">Home</a> </li>
      <li> <a href="resume.html">Resume</a> </li>
      <li> <a href="contact.html">Contact</a> </li>
    </ul>
  </nav>

  <!-- ===== PDF VIEWER ===== -->
  <div class="wrap">
    <div class="content-grid">
      <div class="pdf-col">
        <div class="pdf-viewer">
          <!-- PDF viewer with fallback for browser compatibility -->
          <object data="images/Resume-1.pdf" type="application/pdf" width="100%" style="height:calc(100vh - 6rem);">
            <iframe src="images/Resume-1.pdf" width="100%" style="border:none;height:calc(100vh - 6rem);"></iframe>
          </object>
          <p>If the PDF still doesn't display, <a href="images/Resume-1.pdf" target="_blank" rel="noopener">download the resume (PDF)</a>.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
