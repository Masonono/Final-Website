<!DOCTYPE html>
<!--
  contact.html - Contact Page
  Structure: Navigation → Header → Image Gallery
-->
<html lang="en">
<head>
  <!-- ===== METADATA ===== -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact - Mason Bergen</title>

  <!-- ===== STYLES ===== -->
  <style>
    /* Font imports */
    @import url('https://fonts.googleapis.com/css2?family=Forum&display=swap');

    /* Global resets */
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Forum", serif;
      background: linear-gradient(180deg, #000, #222);
      color: #fff;
    }

    /* ===== NAVIGATION STYLES ===== */
    nav {
      background-color: black;
      font-family: "Forum", serif;
      padding: 0.5rem 0;
    }

    ul {
      text-align: left;
      padding: 0.25rem 0 0.25rem 100px;
      margin: 0;
    }

    li {
      display: inline-block;
      width: clamp(100px, 15vw, 200px);
      line-height: 1.4;
      font-family: "Forum", serif;
      font-size: clamp(1rem, 2vw, 1.5rem);
    }

    a {
      color: white;
      text-decoration: none;
      display: block;
    }

    /* ===== CONTENT STYLES ===== */
    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 1rem;
      box-sizing: border-box;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    p {
      font-size: clamp(0.95rem, 2.6vw, 1.1rem);
      margin: 0.75rem 0;
    }

    /* ===== IMAGE GALLERY STYLES ===== */
    .image-gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .image-gallery img {
      width: 100%;
      height: auto;
      border-radius: 0.5rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    .image-gallery img:hover {
      transform: scale(1.02);
    }

    /* ===== RESPONSIVE STYLES ===== */
    @media (max-width: 800px) {
      .wrap {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0.5rem;
        box-sizing: border-box;
      }

      .image-gallery {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-top: 2rem;
      }
    }

    @media (min-aspect-ratio: 4/3) {
      .wrap {
        margin: 1.5rem auto;
        max-width: 100%;
        padding: 1rem;
      }

      .top {
        justify-content: flex-start;
        gap: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <!-- ===== NAVIGATION BAR ===== -->
  <nav>
    <ul>
      <li> <a href="index.html">Home</a> </li>
      <li> <a href="resume.html">Resume</a> </li>
      <li> <a href="contact.html">Contact</a> </li>
    </ul>
  </nav>

  <!-- ===== IMAGE GALLERY ===== -->
  <div class="wrap">
    <div class="image-gallery">
      <img src="images\Buisness Card Final (Side 2).avif" alt="Mason Bergen's business card, Email address: mason.bergen@gmail.com">
      <img src="images\Buisness Card Final (Side 1).avif" alt="Mason Bergen's business card, Email address: mason.bergen@gmail.com">
    </div>
  </div>
</body>
</html>
